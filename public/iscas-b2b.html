<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa de Iscas B2B — Painel</title>
<style>
  :root{
    --ink:#2A0523;        /* wine-purple deep, texto estrutural */
    --dark:#540247;       /* dark purple */
    --med:#7E0E70;        /* medium purple */
    --teal:#2ABCB5;       /* teal, sinal ativo */
    --teal-d:#1B8E88;
    --wine:#4A0E4E;
    --off:#FBF9F9;        /* off-white base */
    --amber:#B45309;      /* âmbar: só validação/estimativa */
    --amber-bg:#FCF3E8;
    --line:#EADFE7;
    --line-2:#D9C9D4;
    --muted:#7A6B76;
    --card:#FFFFFF;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:Arial,"Helvetica Neue",Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--off);color:var(--ink);font-family:var(--sans);
    line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 72px}

  /* ---- header ---- */
  header{
    background:var(--ink);color:var(--off);
    padding:26px 0 22px;margin-bottom:0;
  }
  .head-inner{max-width:1080px;margin:0 auto;padding:0 20px}
  .eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--teal);font-weight:700;margin:0 0 8px;
  }
  h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em}
  h1 .sub{display:block;font-size:15px;font-weight:400;color:#D7C4D2;letter-spacing:0;margin-top:6px}

  /* diagnosis strip */
  .diag{
    background:var(--dark);color:var(--off);
    border-top:1px solid rgba(255,255,255,.08);
  }
  .diag-inner{
    max-width:1080px;margin:0 auto;padding:12px 20px;
    display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;
    font-size:12.5px;
  }
  .diag b{color:var(--teal);font-family:var(--mono);font-weight:600}
  .diag span{color:#E3D3DE}

  /* ---- tabs ---- */
  nav.tabs{
    position:sticky;top:0;z-index:20;background:var(--off);
    border-bottom:1px solid var(--line-2);
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .tabs-inner{max-width:1080px;margin:0 auto;padding:0 12px;display:flex;gap:2px;min-width:max-content}
  .tab{
    appearance:none;border:0;background:none;cursor:pointer;
    font-family:var(--sans);font-size:13px;color:var(--muted);
    padding:14px 12px 12px;border-bottom:2px solid transparent;
    white-space:nowrap;font-weight:600;letter-spacing:.01em;
  }
  .tab:hover{color:var(--dark)}
  .tab[aria-selected="true"]{color:var(--dark);border-bottom-color:var(--teal)}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:5px}
  .tab[aria-selected="true"] .n{color:var(--teal-d)}

  /* ---- panels ---- */
  .panel{display:none;padding-top:26px;animation:rise .28s ease}
  .panel.on{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.panel{animation:none}}

  h2{font-size:20px;margin:0 0 4px;color:var(--dark);font-weight:800;letter-spacing:-.01em}
  .tagline{color:var(--muted);font-size:13.5px;margin:0 0 18px}

  /* badges */
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
  .badge{
    display:inline-flex;flex-direction:column;gap:1px;
    border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;background:var(--card);
    min-width:96px;
  }
  .badge .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .badge .v{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--ink)}
  .badge.role .v{font-family:var(--sans);font-size:13px}
  .badge.hot{border-color:var(--teal);background:#F0FBFA}
  .badge.warn{border-color:var(--amber);background:var(--amber-bg)}
  .badge.warn .v,.badge.warn .k{color:var(--amber)}

  /* sections inside brand */
  .block{margin:0 0 22px}
  .lab{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--teal-d);font-weight:700;margin:0 0 8px;
  }
  .isca-name{font-size:16px;font-weight:700;color:var(--wine);margin:0 0 4px}
  .p{margin:0 0 8px;font-size:14px}
  .capture{
    display:inline-block;background:#F0FBFA;border:1px solid var(--teal);
    color:var(--teal-d);font-size:12px;font-weight:700;border-radius:6px;
    padding:3px 9px;margin-top:2px;
  }

  ul.clean{list-style:none;margin:0;padding:0}
  ul.clean li{
    position:relative;padding:7px 0 7px 18px;font-size:13.5px;
    border-bottom:1px solid var(--line);
  }
  ul.clean li:last-child{border-bottom:0}
  ul.clean li:before{
    content:"";position:absolute;left:2px;top:14px;width:6px;height:6px;
    border-radius:2px;background:var(--med);
  }
  ul.clean li b{color:var(--ink)}
  ul.clean li .desc{color:var(--muted)}

  /* email timeline */
  .mail{display:flex;flex-direction:column;gap:0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
  .mail-row{display:grid;grid-template-columns:64px 1fr;gap:0;border-bottom:1px solid var(--line)}
  .mail-row:last-child{border-bottom:0}
  .mail-day{
    background:var(--dark);color:var(--off);font-family:var(--mono);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;
  }
  .mail-body{padding:10px 12px}
  .mail-body .asset{font-size:13.5px;font-weight:700;color:var(--ink)}
  .mail-body .fn{font-size:12px;color:var(--muted);margin-top:2px}
  .flag{color:var(--amber);font-weight:700}

  /* callout */
  .call{
    border:1px solid var(--line-2);border-left:5px solid var(--teal);
    background:var(--card);border-radius:8px;padding:13px 15px;margin:0 0 20px;
  }
  .call.amber{border-left-color:var(--amber)}
  .call .ct{font-size:13px;font-weight:800;color:var(--dark);margin:0 0 5px}
  .call.amber .ct{color:var(--amber)}
  .call p{margin:0 0 6px;font-size:13px;color:#3a2b34}
  .call p:last-child{margin:0}

  /* score model */
  .gate{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;margin:0 0 22px;background:var(--card)}
  .gate-zone{display:grid;grid-template-columns:112px 1fr;border-bottom:1px solid var(--line)}
  .gate-zone:last-child{border-bottom:0}
  .gate-score{
    font-family:var(--mono);font-weight:700;font-size:15px;color:var(--off);
    display:flex;align-items:center;justify-content:center;padding:14px 8px;text-align:center;
  }
  .z1 .gate-score{background:var(--teal-d)}
  .z2 .gate-score{background:var(--med)}
  .z3 .gate-score{background:#9C8A97}
  .gate-txt{padding:12px 14px}
  .gate-txt .gt{font-weight:800;font-size:14px;color:var(--ink)}
  .gate-txt .gd{font-size:12.5px;color:var(--muted);margin-top:2px}

  .weights{display:flex;flex-direction:column;gap:10px;margin:0 0 22px}
  .wrow{display:grid;grid-template-columns:150px 1fr 42px;gap:12px;align-items:center}
  .wrow .wn{font-size:13px;font-weight:600}
  .wbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
  .wbar i{display:block;height:100%;background:linear-gradient(90deg,var(--med),var(--teal));border-radius:6px;width:0;transition:width .7s ease}
  .wrow .wv{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right;color:var(--ink)}
  @media (prefers-reduced-motion:reduce){.wbar i{transition:none}}

  /* waves */
  .waves{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 22px}
  .waves th,.waves td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  .waves thead th{background:var(--dark);color:var(--off);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .waves tbody tr:nth-child(even){background:var(--off)}
  .waves .cal{font-weight:700;color:var(--wine)}
  .waves .imp{font-weight:700;color:var(--teal-d)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:640px){
    .grid2{grid-template-columns:1fr}
    .wrow{grid-template-columns:112px 1fr 38px}
    h1{font-size:23px}
  }

  footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
  footer b{color:var(--dark)}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
</style>

<header>
  <div class="head-inner">

    return `

    <div class="lab">Composição dos 100 pontos</div>
    <div class="weights">
      ${w.map(([n,v])=>`<div class="wrow"><div class="wn">${n}</div><div class="wbar"><i data-w="${v}"></i></div><div class="wv">${v}</div></div>`).join('')}

    <p class="p" style="color:var(--muted)">As três perguntas obrigatórias de todo formulário — capital em faixas, praça e prazo — já entregam 65 dos 100 pontos na submissão.</p>

    <div class="call amber">
      <div class="ct">Os pesos são calibração inicial, não regressão</div>
      <p>Derivados dos campos que o comercial já usa. Revisão obrigatória em 60 dias contra taxa de comparecimento e taxa de avanço por faixa. Validar com Expansão antes da Onda 1.</p>

      <p>Correção automática: se o comparecimento do autoagendamento ficar abaixo do SDR por 3 semanas seguidas, o corte de liberação sobe de 70 para 80.</p>

/* ---------------- render ---------------- */
function brandPanel(b){
  const badges = b.badges.map(([k,v,cls])=>`<div class="badge ${cls||''}"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  const variants = b.variants ? `
    <div class="block">
      <div class="lab">Iscas variantes</div>
      <ul class="clean">${b.variants.map(([t,d])=>`<li><b>${t}.</b> <span class="desc">${d}</span></li>`).join('')}</ul>
    </div>` : '';
  const notes = b.note ? b.note.map(n=>`<div class="call"><p>${n}</p></div>`).join('') : '';
  const gap = b.gap ? `<div class="call amber"><div class="ct">Sem cobertura no dossiê</div><p>${b.gap}</p></div>` : '';
  const mails = b.mails ? `
    <div class="block">
      <div class="lab">Conteúdo por e-mail — Trilho ${b.trilho}</div>
      <div class="mail">
        ${b.mails.map(([d,a,f])=>`<div class="mail-row"><div class="mail-day">${d}</div><div class="mail-body"><div class="asset">${a}</div><div class="fn">${f}</div></div></div>`).join('')}
      </div>
    </div>` : '';

  return `
    <h2>${b.label}</h2>
    <p class="tagline">${b.tag}</p>
    <div class="badges">${badges}</div>

    <div class="block">
      <div class="lab">Isca principal</div>
      <div class="isca-name">${b.isca}</div>
      <p class="p">${b.iscaP}</p>
      <span class="capture">${b.capture}</span>
    </div>

    ${variants}

    <div class="block">
      <div class="grid2">
        <div class="badge" style="min-width:0"><span class="k">Piso de qualificação</span><span class="v" style="font-family:var(--sans);font-size:14px">${b.piso}</span></div>
        <div class="badge" style="min-width:0"><span class="k">Trilho de nutrição</span><span class="v" style="font-family:var(--sans);font-size:14px">${b.trilho}</span></div>
      </div>
    </div>

    ${mails}
    ${notes}
    ${gap}
  `;
}

const sections = [overview, scoreModel, ...brands];
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

const tabsInner = document.createElement('div');
tabsInner.className = 'tabs-inner';
tabsEl.appendChild(tabsInner);

sections.forEach((s,i)=>{
  const btn = document.createElement('button');
  btn.className='tab';
  btn.setAttribute('role','tab');
  btn.setAttribute('aria-selected', i===0?'true':'false');
  btn.dataset.id = s.id;
  btn.innerHTML = s.label + (i>1 ? '' : '');
  btn.onclick = ()=>select(s.id);
  tabsInner.appendChild(btn);

  const p = document.createElement('section');
  p.className='panel'+(i===0?' on':'');
  p.id='p-'+s.id;
  p.innerHTML = s.render ? s.render() : brandPanel(s);
  panelsEl.appendChild(p);
});

// footer legend, appended once
const foot = document.createElement('footer');
foot.innerHTML = `
  <b>Como ler:</b> a função da isca é pré-qualificar e reduzir atrito, não capturar e-mail.
  <div class="legend">
    <span><span class="dot" style="background:var(--teal)"></span> sinal ativo / captura</span>
    <span><span class="dot" style="background:var(--med)"></span> estrutura</span>
    <span><span class="dot" style="background:var(--amber)"></span> por validar ou estimativa</span>
  </div>
  <p style="margin-top:12px">Painel gerado a partir do documento Iscas por Marca e Fluxo de Nutrição v4. Dados do RD Station em 10/07/2026.</p>`;
panelsEl.appendChild(foot);

function select(id){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.id===id?'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+id));
  if(id==='score') animateWeights();
  window.scrollTo({top:0,behavior:'smooth'});
  const active = document.querySelector('.tab[aria-selected="true"]');
  if(active) active.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}

// Deep-link to a single brand panel (used when embedded per marca).
(function(){
  const params = new URLSearchParams(location.search);
  const only = params.get('tab');
  if(!only) return;
  const target = document.getElementById('p-'+only);
  if(!target) return;
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+only));
  const nav = document.querySelector('nav.tabs');
  if(nav) nav.style.display = 'none';
  const diag = document.querySelector('.diag');
  if(diag) diag.style.display = 'none';
  const head = document.querySelector('header .head-inner');
  if(head){
    const h1 = head.querySelector('h1');
    const sub = h1?.querySelector('.sub');
    if(sub) sub.textContent = 'Programa de Iscas B2B';
  }
})();

function animateWeights(){
  requestAnimationFrame(()=>{
    document.querySelectorAll('#p-score .wbar i').forEach(bar=>{
      bar.style.width = bar.dataset.w+'%';
    });
  });
}
